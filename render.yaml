services:
  - type: web
    name: sentrywatch
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && uvicorn scoring_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: REQUIRE_ML
        value: "1"
      - key: BASELINE_LOG_SPACE
        value: "1"
      - key: ALERTABLE_SEVERITIES
        value: high,medium
